backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: src/img
public_folder: img

collections:
  - name: site
    label: Site Content
    files:
      - label: Home Page
        name: home
        file: src/_data/site.json
        format: json
        fields:
          - label: Meta
            name: meta
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Brand
            name: brand
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Highlight, name: highlight, widget: string }

          - label: Navigation
            name: nav
            widget: object
            fields:
              - label: Links
                name: links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Anchor Href, name: href, widget: string }
              - { label: CTA Label, name: ctaLabel, widget: string }
              - { label: CTA Href, name: ctaHref, widget: string }

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text (HTML allowed), name: text, widget: text }
              - label: Primary Button
                name: primaryButton
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
              - label: Secondary Button
                name: secondaryButton
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }

          - label: Mobile Banner
            name: mobileBanner
            widget: object
            fields:
              - { label: Highlight, name: highlight, widget: string }
              - { label: Text, name: text, widget: string }

          - label: About
            name: about
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Image Alt, name: imageAlt, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Label, name: label, widget: string }

          - label: Menu Section
            name: menu
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Price, name: price, widget: string }
                  - { label: Image, name: image, widget: string }
                  - { label: Image Alt, name: imageAlt, widget: string }

          - label: Testimonials Section
            name: testimonials
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Stars, name: stars, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Avatar Letter, name: avatar, widget: string }

          - label: Locations Section
            name: locations
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Address, name: address, widget: string }
                  - { label: Image, name: image, widget: image }
                  - { label: Image Alt, name: imageAlt, widget: string }

          - label: Promo Section
            name: promo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Phrase, name: phrase, widget: string }
              - { label: Note, name: note, widget: text }
              - { label: Button Label, name: buttonLabel, widget: string }
              - { label: Button Href, name: buttonHref, widget: string }

          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Tagline, name: tagline, widget: string }
              - { label: Copyright, name: copyright, widget: string }
              - label: Quick Links
                name: quickLinks
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
              - label: Social Links
                name: socialLinks
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
                  - { label: Aria Label, name: ariaLabel, widget: string }

          - label: Mascot
            name: mascot
            widget: object
            fields:
              - { label: Bubble Message (HTML allowed), name: message, widget: text }

          - label: Mobile Sticky CTA
            name: mobileCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
